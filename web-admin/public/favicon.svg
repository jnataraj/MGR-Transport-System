<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="12" fill="#1A3C8F"/>

  <!-- Bus body -->
  <rect x="7" y="22" width="50" height="26" rx="4" fill="#2B5CE6"/>

  <!-- Gold stripe -->
  <rect x="7" y="35" width="50" height="5" fill="#F5B800"/>

  <!-- Roof -->
  <rect x="9" y="17" width="44" height="8" rx="3" fill="#F5B800"/>

  <!-- Windows (side) -->
  <rect x="10" y="24" width="10" height="9" rx="2" fill="#A8C8F0" opacity="0.9"/>
  <rect x="23" y="24" width="10" height="9" rx="2" fill="#A8C8F0" opacity="0.9"/>
  <rect x="36" y="24" width="10" height="9" rx="2" fill="#A8C8F0" opacity="0.9"/>

  <!-- Front windshield -->
  <rect x="48" y="23" width="7" height="10" rx="2" fill="#A8C8F0" opacity="0.85"/>

  <!-- Front bumper/grill area -->
  <rect x="52" y="34" width="5" height="6" rx="1" fill="#0D2B6B"/>
  <rect x="53" y="35" width="3" height="1.5" rx="0.5" fill="#F5B800"/>
  <rect x="53" y="37" width="3" height="1.5" rx="0.5" fill="#F5B800"/>

  <!-- Headlights -->
  <rect x="51" y="24" width="5" height="3" rx="1" fill="#FFEE99"/>

  <!-- Door -->
  <rect x="42" y="27" width="5" height="10" rx="1.5" fill="#1A3C8F"/>

  <!-- Wheels -->
  <circle cx="18" cy="49" r="6" fill="#0D2B6B"/>
  <circle cx="18" cy="49" r="3.2" fill="#F5B800"/>
  <circle cx="18" cy="49" r="1.5" fill="#0D2B6B"/>

  <circle cx="46" cy="49" r="6" fill="#0D2B6B"/>
  <circle cx="46" cy="49" r="3.2" fill="#F5B800"/>
  <circle cx="46" cy="49" r="1.5" fill="#0D2B6B"/>

  <!-- Undercarriage -->
  <rect x="11" y="46" width="42" height="4" rx="1" fill="#1A3C8F"/>
</svg>